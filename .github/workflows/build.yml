name: Build scmod (zip drop-in)

# HOW TO USE
#  1. Put this file at .github/workflows/build.yml in your repo.
#  2. Drop TdmCS_Paket.zip (or any zip that contains mod folders with modinfo.json + .cs files) in the repo root.
#  3. Put the game dlls in libs/ (Survivalcraft.dll, Engine.dll, EntitySystem.dll) and the CS mod dlls
#     (ScCsgoKnives.dll, ScCsgoTactical.dll) - or just drop the CS mods' .scmod files anywhere in the repo,
#     the dlls are pulled out of them automatically.
#  4. Push. Every mod found (ArenaCS, TdmCS, ...) is built and packed as <Name>.scmod.
#     Download from the repo's Releases page (build-N) or Actions > run > Artifacts.

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "ga"

      - name: Build every mod found
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/build_mods.py" <<'PY'
          import glob, json, os, re, shutil, subprocess, sys, zipfile

          ROOT = os.getcwd()
          WORK = os.path.join(ROOT, "_work")
          shutil.rmtree(WORK, ignore_errors=True)
          SRC = os.path.join(WORK, "src")
          LIBS = os.path.join(WORK, "libs")
          OUT = os.path.join(WORK, "out")
          for d in (SRC, LIBS, OUT):
              os.makedirs(d)

          SKIP = {".git", "_work", "bin", "obj", "node_modules"}

          def walk(base):
              for dp, dn, fn in os.walk(base):
                  dn[:] = [d for d in dn if d not in SKIP]
                  for f in fn:
                      yield os.path.join(dp, f)

          # 1. dlls: loose dlls in the repo, plus dlls inside any .scmod in the repo
          GAME = ["Survivalcraft.dll", "Engine.dll", "EntitySystem.dll"]
          for p in walk(ROOT):
              low = os.path.basename(p)
              if low.lower().endswith(".dll"):
                  dst = os.path.join(LIBS, low)
                  if not os.path.exists(dst):
                      shutil.copy(p, dst)
              elif low.lower().endswith(".scmod"):
                  try:
                      with zipfile.ZipFile(p) as z:
                          for n in z.namelist():
                              if n.lower().endswith(".dll"):
                                  dst = os.path.join(LIBS, os.path.basename(n))
                                  if not os.path.exists(dst):
                                      with z.open(n) as s, open(dst, "wb") as o:
                                          shutil.copyfileobj(s, o)
                  except zipfile.BadZipFile:
                      print("::warning::not a zip: " + p)
          print("dlls available:", sorted(os.listdir(LIBS)))
          have_game = all(os.path.exists(os.path.join(LIBS, g)) for g in GAME)
          if not have_game:
              print("::warning::Survivalcraft.dll / Engine.dll / EntitySystem.dll not all found; "
                    "falling back to the NuGet package SurvivalcraftAPI.Survivalcraft (version not verified). "
                    "Put the three game dlls in libs/ for a reliable build.")

          # 2. unpack every zip in the repo
          for z in glob.glob(os.path.join(ROOT, "**", "*.zip"), recursive=True):
              if os.sep + "_work" + os.sep in z or os.sep + ".git" + os.sep in z:
                  continue
              dst = os.path.join(SRC, re.sub(r"[^A-Za-z0-9_.-]", "_", os.path.basename(z)))
              try:
                  with zipfile.ZipFile(z) as zf:
                      zf.extractall(dst)
                  print("unpacked", z)
              except zipfile.BadZipFile:
                  print("::warning::not a valid zip: " + z)

          # 3. find mods (folders with modinfo.json): in unpacked zips and loose in the repo
          mods = {}
          for base in (SRC, ROOT):
              for p in walk(base):
                  if os.path.basename(p) != "modinfo.json":
                      continue
                  folder = os.path.dirname(p)
                  if base == ROOT and os.path.commonpath([folder, SRC]) == SRC:
                      continue
                  try:
                      info = json.load(open(p, encoding="utf-8-sig"))
                  except Exception as e:
                      print("::warning::bad modinfo.json %s: %s" % (p, e))
                      continue
                  name = re.sub(r"[^A-Za-z0-9_]", "", info.get("Name", "")) or "Mod"
                  if name in mods:
                      continue          # first one wins (zip contents are listed before loose files)
                  mods[name] = (folder, info)
          if not mods:
              print("::error::No mod found. Drop a zip with modinfo.json + .cs files in the repo root.")
              sys.exit(1)
          print("mods found:", sorted(mods))

          # 4. build each mod
          failed = []
          for name, (folder, info) in sorted(mods.items()):
              print("::group::Build " + name)
              try:
                  cs = [f for f in walk(folder) if f.endswith(".cs")]
                  if not cs:
                      raise RuntimeError("no .cs files in " + folder)
                  deps = info.get("Dependencies", {})
                  proj_dir = os.path.join(WORK, "proj", name)
                  os.makedirs(proj_dir)
                  refs = []
                  if have_game:
                      refs += [os.path.join(LIBS, g) for g in GAME]
                  for d in sorted(os.listdir(LIBS)):
                      full = os.path.join(LIBS, d)
                      if d not in GAME and d.lower().endswith(".dll"):
                          refs.append(full)
                  # a mod that depends on another mod needs that mod's dll
                  needed = []
                  if isinstance(deps, dict):
                      needed = [k.split(".")[-1] + ".dll" for k in deps]
                  for n in needed:
                      if not os.path.exists(os.path.join(LIBS, n)):
                          raise RuntimeError("missing dependency dll %s (put it in libs/ or add the mod's .scmod to the repo)" % n)
                  items = "\n".join('    <Reference Include="%s" Private="false" />' % r for r in refs)
                  pkg = "" if have_game else '    <PackageReference Include="SurvivalcraftAPI.Survivalcraft" Version="1.9.3.1" />\n'
                  csproj = """<Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <AssemblyName>%s</AssemblyName>
              <RootNamespace>%s</RootNamespace>
              <LangVersion>latest</LangVersion>
              <Nullable>disable</Nullable>
              <ImplicitUsings>disable</ImplicitUsings>
              <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
              <GenerateAssemblyInfo>false</GenerateAssemblyInfo>
              <TreatWarningsAsErrors>false</TreatWarningsAsErrors>
              <NoWarn>$(NoWarn);CS0618;CS0612;CS8981;NU1701;NU1702</NoWarn>
            </PropertyGroup>
            <ItemGroup>
              <Compile Include="%s/**/*.cs" />
            </ItemGroup>
            <ItemGroup>
          %s
          %s  </ItemGroup>
          </Project>
          """ % (name, name, folder.replace("\\", "/"), items, pkg)
                  open(os.path.join(proj_dir, name + ".csproj"), "w", encoding="utf-8").write(csproj)
                  out_dir = os.path.join(WORK, "bin", name)
                  r = subprocess.run(["dotnet", "build", os.path.join(proj_dir, name + ".csproj"),
                                      "-c", "Release", "-o", out_dir], text=True)
                  dll = os.path.join(out_dir, name + ".dll")
                  if r.returncode != 0 or not os.path.exists(dll):
                      raise RuntimeError("dotnet build failed")
                  # pack
                  scmod = os.path.join(OUT, name + ".scmod")
                  with zipfile.ZipFile(scmod, "w", zipfile.ZIP_DEFLATED) as z:
                      z.write(dll, name + ".dll")
                      for f in walk(folder):
                          rel = os.path.relpath(f, folder).replace(os.sep, "/")
                          if f.endswith((".cs", ".dll", ".csproj")) or rel == "modinfo.json":
                              continue
                          z.write(f, rel)
                      z.write(os.path.join(folder, "modinfo.json"), "modinfo.json")
                  print("packed", scmod)
                  with zipfile.ZipFile(scmod) as z:
                      for n in z.namelist():
                          print("   ", n)
              except Exception as e:
                  print("::error::%s failed: %s" % (name, e))
                  failed.append(name)
              print("::endgroup::")

          if failed:
              print("FAILED: " + ", ".join(failed))
              # still publish the mods that did build
              open(os.path.join(WORK, "failed.txt"), "w").write(",".join(failed))
          PY
          python3 "$RUNNER_TEMP/build_mods.py"
          ls -la _work/out

      - name: Upload scmod files
        uses: actions/upload-artifact@v4
        with:
          name: scmod-files
          path: _work/out/*.scmod
          if-no-files-found: error

      - name: Publish release (direct download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: _work/out/*.scmod

      - name: Fail if a mod did not build
        shell: bash
        run: |
          if [ -f _work/failed.txt ]; then
            echo "::error::These mods failed: $(cat _work/failed.txt)"
            exit 1
          fi
