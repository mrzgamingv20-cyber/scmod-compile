name: Build scmod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Find project file
        id: proj
        run: |
          PROJ=$(ls ./*.csproj | head -n 1)
          echo "Using project: $PROJ"
          echo "path=$PROJ" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore "${{ steps.proj.outputs.path }}"

      - name: Build
        run: >
          dotnet build "${{ steps.proj.outputs.path }}"
          -c Release --no-restore
          -p:AssemblyName=SplitScreenFlip
          -o out

      - name: Package scmod
        run: |
          test -f out/SplitScreenFlip.dll
          mkdir pack
          cp out/SplitScreenFlip.dll pack/
          cp modinfo.json pack/
          (cd pack && zip -r ../SplitScreenFlip.scmod .)
          echo "Package contents:"
          unzip -l SplitScreenFlip.scmod

      - name: Upload scmod
        uses: actions/upload-artifact@v4
        with:
          name: SplitScreenFlip-scmod
          path: SplitScreenFlip.scmod
        
