name: Build scmod (universal)

# Put ONE mod zip in the repo root (it must contain *.cs files + modinfo.json).
# The mod name is read from modinfo.json ("Name") and used for the dll and the .scmod file.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Unpack mod zip
        id: mod
        run: |
          ZIP=$(ls ./*.zip 2>/dev/null | head -n 1 || true)
          rm -rf modsrc && mkdir modsrc
          if [ -n "$ZIP" ]; then
            echo "Using zip: $ZIP"
            unzip -q -o "$ZIP" -d modsrc
          else
            echo "No zip found, using loose files from repo root"
            cp ./*.cs modsrc/ 2>/dev/null || true
            cp ./modinfo.json modsrc/
          fi
          INFO=$(find modsrc -name modinfo.json | head -n 1)
          test -n "$INFO" || { echo "modinfo.json not found"; exit 1; }
          ROOT=$(dirname "$INFO")
          NAME=$(python3 -c "import json,re,sys; n=json.load(open(sys.argv[1],encoding='utf-8-sig')).get('Name','Mod'); print(re.sub(r'[^A-Za-z0-9_]','',n) or 'Mod')" "$INFO")
          echo "Mod name: $NAME"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Patch project file
        run: |
          PROJ=$(ls ./*.csproj | head -n 1)
          echo "Using project: $PROJ"
          python3 - "$PROJ" <<'PY'
          import re, sys, os
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          def keep(m):
              return m.group(0) if os.path.exists(m.group(1).replace("\\", "/")) else ""
          s = re.sub(r'<Compile\s+Include="([^"]+)"\s*/>', keep, s)
          add = '  <ItemGroup><Compile Remove="modsrc/**/*.cs" /><Compile Include="modsrc/**/*.cs" /></ItemGroup>\n'
          if "modsrc/**" not in s:
              s = s.replace("</Project>", add + "</Project>")
          open(p, "w", encoding="utf-8").write(s)
          PY

      - name: Restore
        run: dotnet restore "$(ls ./*.csproj | head -n 1)"

      - name: Build
        run: >
          dotnet build "$(ls ./*.csproj | head -n 1)"
          -c Release --no-restore
          -p:AssemblyName=${{ steps.mod.outputs.name }}
          -o out

      - name: Package scmod
        run: |
          NAME="${{ steps.mod.outputs.name }}"
          ROOT="${{ steps.mod.outputs.root }}"
          test -f "out/$NAME.dll"
          rm -rf pack && mkdir pack
          cp "out/$NAME.dll" pack/
          # copy modinfo.json and any extra non-source files from the mod zip
          (cd "$ROOT" && find . -type f ! -name '*.cs' ! -name '*.dll' -print0 | xargs -0 -I{} cp --parents {} "$GITHUB_WORKSPACE/pack/")
          (cd pack && zip -r "../$NAME.scmod" .)
          unzip -l "$NAME.scmod"

      - name: Upload scmod
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.mod.outputs.name }}-scmod
          path: ${{ steps.mod.outputs.name }}.scmod
