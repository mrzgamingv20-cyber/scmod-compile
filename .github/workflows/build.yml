name: Build scmod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Patch project file
        run: |
          python3 - <<'EOF'
          import glob, os, re
          proj = sorted(glob.glob("*.csproj"))[0]
          text = open(proj, encoding="utf-8-sig").read()
          pattern = re.compile(r'[ \t]*<Compile\s+Include="([^"]+)"[^>]*?(?:/>|>\s*</Compile>)[ \t]*\r?\n?')
          def drop(m):
              path = m.group(1).replace("\\", "/")
              if "*" in path or os.path.exists(path):
                  return m.group(0)
              print("Removing missing source:", path)
              return ""
          text = pattern.sub(drop, text)
          add = '  <ItemGroup>\n    <Compile Include="SplitScreenFlip.cs" Condition="\'$(EnableDefaultCompileItems)\' == \'false\'" />\n  </ItemGroup>\n'
          text = text.replace("</Project>", add + "</Project>")
          open(proj, "w", encoding="utf-8").write(text)
          EOF
          echo "----- Patched project file -----"
          cat ./*.csproj

      - name: Find project file
        id: proj
        run: |
          PROJ=$(ls ./*.csproj | head -n 1)
          echo "Using project: $PROJ"
          echo "path=$PROJ" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore "${{ steps.proj.outputs.path }}"

      - name: Build
        run: >
          dotnet build "${{ steps.proj.outputs.path }}"
          -c Release --no-restore
          -p:AssemblyName=SplitScreenFlip
          -o out

      - name: Package scmod
        run: |
          test -f out/SplitScreenFlip.dll
          mkdir pack
          cp out/SplitScreenFlip.dll pack/
          cp modinfo.json pack/
          (cd pack && zip -r ../SplitScreenFlip.scmod .)
          echo "Package contents:"
          unzip -l SplitScreenFlip.scmod

      - name: Upload scmod
        uses: actions/upload-artifact@v4
        with:
          name: SplitScreenFlip-scmod
          path: SplitScreenFlip.scmod
