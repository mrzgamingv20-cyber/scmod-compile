name: Build TreeFall scmod

on:
  push:
  workflow_dispatch:

env:
  MOD_NAME: TreeFall

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Locate sources and game dlls
        run: |
          set -e
          echo "Files in repo:"
          find . -type f -not -path './.git/*' | sort | head -100

          LOADER=$(find . -type f -name 'TreeFallLoader.cs' -not -path './.git/*' | head -n1)
          [ -n "$LOADER" ] || { echo "::error::TreeFallLoader.cs not found in repo"; exit 1; }
          SRC=$(dirname "$LOADER")
          for f in TreeFallPhysics.cs modinfo.json; do
            [ -f "$SRC/$f" ] || { echo "::error::$f not found next to TreeFallLoader.cs ($SRC)"; exit 1; }
          done

          SC=$(find . -type f -iname 'Survivalcraft.dll' -not -path './.git/*' | head -n1)
          [ -n "$SC" ] || { echo "::error::Survivalcraft.dll not found anywhere in repo. Upload Survivalcraft.dll, Engine.dll, EntitySystem.dll from the game APK."; exit 1; }
          DLLDIR=$(dirname "$SC")
          mkdir -p "$GITHUB_WORKSPACE/_refs"
          cp "$DLLDIR"/*.dll "$GITHUB_WORKSPACE/_refs/"
          for f in Engine.dll EntitySystem.dll; do
            [ -n "$(find "$GITHUB_WORKSPACE/_refs" -iname "$f")" ] || { echo "::error::$f not found next to Survivalcraft.dll ($DLLDIR)"; exit 1; }
          done

          echo "SRC_DIR=$GITHUB_WORKSPACE/$SRC" >> "$GITHUB_ENV"
          echo "Source dir: $SRC"
          echo "Reference dlls:"; ls -la "$GITHUB_WORKSPACE/_refs"

      - name: Generate project file
        run: |
          mkdir -p _build
          cat > _build/$MOD_NAME.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <OutputType>Library</OutputType>
              <LangVersion>latest</LangVersion>
              <Nullable>disable</Nullable>
              <ImplicitUsings>disable</ImplicitUsings>
              <AllowUnsafeBlocks>true</AllowUnsafeBlocks>
              <GenerateAssemblyInfo>false</GenerateAssemblyInfo>
              <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
              <TreatWarningsAsErrors>false</TreatWarningsAsErrors>
              <NoWarn>$(NoWarn);CS0618;CS0649;CS0169;CS0414;CS1591;CS8981</NoWarn>
              <DebugType>none</DebugType>
            </PropertyGroup>
            <ItemGroup>
              <Compile Include="$(SrcDir)/TreeFallLoader.cs" />
              <Compile Include="$(SrcDir)/TreeFallPhysics.cs" />
              <GameDll Include="$(RefsDir)/*.dll" />
              <Reference Include="@(GameDll)" Private="false" />
            </ItemGroup>
          </Project>
          EOF

      - name: Build
        run: |
          set -e
          dotnet build _build/$MOD_NAME.csproj -c Release \
            -p:AssemblyName=$MOD_NAME \
            -p:SrcDir="$SRC_DIR" \
            -p:RefsDir="$GITHUB_WORKSPACE/_refs" \
            -o _out

      - name: Package .scmod
        run: |
          set -e
          test -f "_out/$MOD_NAME.dll" || { echo "::error::$MOD_NAME.dll not produced"; exit 1; }
          mkdir -p _pkg
          cp "_out/$MOD_NAME.dll" _pkg/
          cp "$SRC_DIR/modinfo.json" _pkg/
          (cd _pkg && zip -r -9 "../$MOD_NAME.scmod" .)
          echo "Contents of $MOD_NAME.scmod:"
          unzip -l "$MOD_NAME.scmod"

      - name: Upload .scmod
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MOD_NAME }}-scmod
          path: ${{ env.MOD_NAME }}.scmod
          if-no-files-found: error
